<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Segeln AG 2026 – Kartenstudio</title>

<style>

/* =========================================================
   GRUNDLAGEN
========================================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    color: #18202d;

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(83,151,255,.13),
            transparent 28%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(115,75,220,.08),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #edf5ff,
            #f8fbff 50%,
            #edf4ff
        );

    min-height: 100vh;
}

button,
input {
    font: inherit;
}

button {
    cursor: pointer;
}


/* =========================================================
   APP
========================================================= */

.page {
    width: 100%;
    min-height: 100vh;
    padding: 22px;
}


/* =========================================================
   HEADER
========================================================= */

.header {

    max-width: 1480px;

    margin:
        0 auto 24px;

    padding:
        17px 22px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background:
        rgba(255,255,255,.88);

    backdrop-filter:
        blur(22px);

    border:
        1px solid rgba(0,0,0,.06);

    border-radius:
        24px;

    box-shadow:
        0 12px 40px
        rgba(36,73,116,.08);
}

.logoArea {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logoIcon {

    width: 48px;
    height: 48px;

    display: grid;
    place-items: center;

    border-radius: 15px;

    background:
        linear-gradient(
            135deg,
            #287ef1,
            #35b9c7
        );

    color: white;

    font-size: 25px;

    box-shadow:
        0 7px 18px
        rgba(40,126,241,.25);
}

.logo {
    font-size: 20px;
    font-weight: 850;
}

.logoSub {
    color: #788397;
    font-size: 13px;
    margin-top: 2px;
}

.madeBadge {

    background: #111827;

    color: white;

    border-radius: 999px;

    padding:
        9px 16px;

    font-size: 13px;

    font-weight: 750;
}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace {

    max-width: 1480px;

    margin: auto;

    display: grid;

    grid-template-columns:
        500px minmax(0, 1fr);

    gap: 28px;

    align-items: start;
}


/* =========================================================
   PANELS
========================================================= */

.previewPanel,
.formPanel {

    background:
        rgba(255,255,255,.94);

    border:
        1px solid rgba(0,0,0,.06);

    border-radius:
        28px;

    box-shadow:
        0 16px 48px
        rgba(39,73,113,.09);
}

.previewPanel {

    padding: 28px;

    position: sticky;

    top: 18px;
}

.formPanel {

    padding: 34px 38px;
}


/* =========================================================
   TITEL
========================================================= */

.previewTitle,
.formTitle {

    font-weight: 850;

    letter-spacing: -.4px;
}

.previewTitle {

    font-size: 23px;

    margin-bottom: 18px;
}

.formTitle {

    font-size: 27px;

    margin-bottom: 28px;
}

.sectionTitle {

    color: #768195;

    font-size: 15px;

    margin-bottom: 17px;
}


/* =========================================================
   MODE
========================================================= */

.modeButtons {

    display: flex;

    gap: 10px;

    margin-bottom: 18px;
}

.modeButton {

    flex: 1;

    border:
        1px solid #dfe4ec;

    background: white;

    color: #4b5563;

    border-radius: 999px;

    padding: 12px 15px;

    font-weight: 700;
}

.modeButton.active {

    background:
        linear-gradient(
            135deg,
            #357ff0,
            #5a67ed
        );

    border-color:
        #357ff0;

    color: white;

    box-shadow:
        0 7px 20px
        rgba(53,127,240,.25);
}

.infoCircle {

    width: 40px;
    height: 40px;

    margin:
        0 auto 18px;

    border-radius: 50%;

    border:
        1px solid #dde3eb;

    display: grid;

    place-items: center;

    color: #748095;

    background: white;

    font-weight: 800;
}


/* =========================================================
   KARTEN-VORSCHAU
========================================================= */

.cardStage {

    display: flex;

    justify-content: center;

    padding:
        5px 0 18px;
}


/*
   Bildschirmgröße der Vorschau.
   Die echte Druckgröße wird weiter unten
   ausschließlich über mm definiert.
*/

.card {

    position: relative;

    width: 390px;
    height: 546px;

    overflow: hidden;

    border-radius: 7px;

    background:
        linear-gradient(
            125deg,
            #4b9ce7,
            #61c9bd,
            #efbd67
        );

    color: white;

    box-shadow:
        0 22px 55px
        rgba(15,30,55,.25);

    isolation: isolate;

    transition:
        background .5s ease,
        box-shadow .3s ease;
}


/* Licht */

.card::before {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,255,255,.25),
            transparent 27%
        ),
        radial-gradient(
            circle at 85% 80%,
            rgba(255,255,255,.15),
            transparent 30%
        );

    pointer-events: none;

    z-index: 1;
}


/* =========================================================
   RARE
   KEINE ANIMATIONEN!
========================================================= */

.card.rare {

    background:

        radial-gradient(
            circle at 15% 12%,
            rgba(55,182,255,.60),
            transparent 27%
        ),

        radial-gradient(
            circle at 85% 15%,
            rgba(180,70,255,.58),
            transparent 28%
        ),

        radial-gradient(
            circle at 55% 90%,
            rgba(0,225,190,.35),
            transparent 32%
        ),

        linear-gradient(
            135deg,
            #04091c,
            #111444 40%,
            #32124d 72%,
            #061c32
        );

    box-shadow:
        0 0 28px
        rgba(89,80,255,.42),

        0 25px 70px
        rgba(15,20,60,.5);
}


/* Statisches Hologramm */

.hologram {

    position: absolute;

    inset: 0;

    opacity: 0;

    z-index: 2;

    pointer-events: none;

    background:

        repeating-linear-gradient(
            115deg,
            transparent 0px,
            transparent 17px,
            rgba(255,255,255,.055) 19px,
            transparent 22px
        ),

        linear-gradient(
            110deg,
            transparent 25%,
            rgba(120,220,255,.10) 45%,
            rgba(255,120,245,.08) 58%,
            transparent 80%
        );

    mix-blend-mode: screen;
}

.card.rare .hologram {
    opacity: 1;
}


/* Statischer Glanz */

.shine {

    position: absolute;

    width: 160%;

    height: 75px;

    left: -30%;

    top: 43%;

    transform:
        rotate(-18deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.20),
            transparent
        );

    z-index: 14;

    pointer-events: none;

    opacity: 0;
}

.card.rare .shine {
    opacity: 1;
}


/* =========================================================
   PARTIKEL – STATISCH
========================================================= */

.particle {

    position: absolute;

    opacity: 0;

    z-index: 4;

    pointer-events: none;

    border-radius: 3px;

    box-shadow:
        0 0 10px
        currentColor;
}

.card.rare .particle {
    opacity: .9;
}

.p1 {
    width: 9px;
    height: 18px;
    background: #62dfff;
    color: #62dfff;
    left: 32px;
    top: 150px;
    transform: rotate(25deg);
}

.p2 {
    width: 12px;
    height: 12px;
    background: #ffe66d;
    color: #ffe66d;
    right: 36px;
    top: 220px;
    transform: rotate(45deg);
}

.p3 {
    width: 8px;
    height: 17px;
    background: #ff65bb;
    color: #ff65bb;
    left: 48px;
    bottom: 150px;
    transform: rotate(30deg);
}

.p4 {
    width: 11px;
    height: 11px;
    background: #80ffcb;
    color: #80ffcb;
    right: 55px;
    bottom: 170px;
    transform: rotate(45deg);
}

.p5 {
    width: 7px;
    height: 7px;
    background: white;
    color: white;
    left: 190px;
    top: 250px;
}


/* =========================================================
   SCHNITTKANTE
========================================================= */

.cutLine {

    position: absolute;

    inset: 16px;

    border:
        2px dashed
        rgba(0,0,0,.38);

    z-index: 30;

    pointer-events: none;
}

.card.rare .cutLine {

    border-color:
        rgba(255,255,255,.48);
}


/* =========================================================
   VORDERSEITE
========================================================= */

.frontSide {
    position: absolute;
    inset: 0;
}


/* =========================================================
   HANDSCHRIFTLICHE NUMMER
========================================================= */


/* =========================================================
   KARTEN-TOP
========================================================= */

.cardTop {

    position: absolute;

    left: 36px;

    right: 82px;

    top: 58px;

    z-index: 15;
}

.subjectText {

    font-size: 15px;

    line-height: 1.25;

    min-height: 0;

    margin-bottom: 9px;

    font-weight: 650;

    text-shadow:
        0 2px 5px
        rgba(0,0,0,.25);
}

.nameText {

    margin-top: 0;

    font-size: 31px;

    line-height: 1.08;

    font-weight: 430;

    text-shadow:
        0 3px 7px
        rgba(0,0,0,.25);
}

.rareText {

    display: none;

    margin-top: 7px;

    font-size: 12px;

    font-weight: 900;

    letter-spacing: 1.3px;

    color: #ffe879;

    text-shadow:
        0 0 10px
        rgba(255,231,105,.75);
}

.card.rare .rareText {
    display: block;
}


/* =========================================================
   FOTO
========================================================= */

.photoWindow {

    position: absolute;

    left: 50%;

    top: 58%;

    width: 330px;

    height: 350px;

    transform:
        translate(-50%, -50%);

    overflow: hidden;

    z-index: 8;

    pointer-events: none;
}

.photo {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 100%;

    object-fit: contain;

    transform:
        translate(-50%,-50%)
        scale(1);

    filter:
        drop-shadow(
            0 13px 14px
            rgba(0,0,0,.20)
        );

    user-select: none;
}


/* =========================================================
   SPRUCH
========================================================= */

.quote {

    position: absolute;

    left: 35px;

    right: 35px;

    bottom: 24px;

    min-height: 46px;

    padding:
        10px 13px;

    display: flex;

    align-items: center;

    background:
        rgba(25,30,38,.27);

    border:
        1px solid
        rgba(255,255,255,.12);

    color: white;

    font-size: 12px;

    z-index: 17;

    backdrop-filter:
        blur(4px);
}


/* =========================================================
   RÜCKSEITE
========================================================= */

.backSide {

    display: none;

    position: absolute;

    inset: 0;

    z-index: 20;

    color: #18202d;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #eef8ff
        );
}

.card.showBack .frontSide {
    visibility: hidden;
}

.card.showBack .backSide {
    display: block;
}

.backInner {

    position: absolute;

    inset: 16px;

    border-radius: 7px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.96),
            rgba(240,250,255,.95)
        );

    padding: 31px;

    display: flex;

    flex-direction: column;

    overflow: hidden;

    border:
        1px solid
        rgba(25,95,150,.08);
}

.backInner::after {

    content: "";

    position: absolute;

    width: 260px;

    height: 260px;

    border-radius: 50%;

    right: -110px;

    bottom: -110px;

    background:
        radial-gradient(
            circle,
            rgba(42,157,143,.18),
            transparent 65%
        );
}

.backName {

    font-size: 26px;

    line-height: 1.1;
}

.backLogo {

    position: absolute;

    right: 28px;

    top: 27px;

    font-size: 15px;

    font-weight: 900;

    color: #218b7b;
}

.backCenter {

    flex: 1;

    display: grid;

    place-items: center;

    font-size: 65px;

    opacity: .13;
}

.backProject {

    text-align: center;

    color: #67758a;

    font-weight: 700;

    font-size: 12px;
}

.backClass {
    text-align: center;
    color: #1d6f7a;
    font-weight: 800;
    font-size: 14px;
    letter-spacing: .12em;
    text-transform: uppercase;
    margin-top: 8px;
}

.backMade {

    text-align: center;

    color: #8b95a4;

    font-size: 9px;

    margin-top: 4px;
}


/* =========================================================
   PREVIEW BUTTON
========================================================= */

.cutInfo {

    margin:
        0 5px 15px;

    color: #707a89;

    font-size: 13px;

    line-height: 1.5;
}

.switchSide {

    width: 100%;

    background: white;
